name: CI

on:
  push:
  pull_request:

# Least privilege (security check S10): the workflows only read the code. No pull_request_target.
permissions:
  contents: read

jobs:
  build:
    name: Tests, lint and release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install the SDK components the build pins
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      # The release build is unsigned: no keystore or signing secret exists anywhere.
      - run: ./gradlew testDebugUnitTest lintRelease assembleRelease verifyReleaseSecurity assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - run: ./gitleaks git --config .gitleaks.toml --redact --verbose .
